

name: Playwright API Tests (Cucumber)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://restful-booker.herokuapp.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Prepare report files
        if: ${{ !cancelled() }}
        run: |
          mkdir -p public/reports 

          if [ -d reports ]; then
            cp -R reports/. public/reports/
          fi         

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Cucumber API Test Report</title>
          </head>
          <body>
            <h1>Cucumber API Test Report</h1>
            <p>Report files published from GitHub Actions.</p>
            <ul>
              <li><a href="reports/cucumber-report.html">View Cucumber HTML Report</a></li>

            </ul>
          </body>
          </html>
          EOF

          touch public/.nojekyll

      - name: Upload Cucumber report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            reports/            
            public/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

      - name: Record test outcome
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "API tests passed."
          else
            echo "API tests failed. The report will still be published."
          fi

  deploy:
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: api-tests
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4